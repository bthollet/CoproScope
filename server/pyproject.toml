[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "coproscope"
version = "0.1.0"
description = "Local-first documentary cockpit for copropriete workflows."
readme = "README.md"
requires-python = ">=3.11"
authors = [{ name = "Codex" }]
dependencies = []

[project.scripts]
coprocs = "coproscope.cli:main"

[tool.setuptools]
package-dir = {"" = "src"}

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
coproscope = [
  "configs/*.yml",
  "schemas/*.json",
  "templates/*.csv",
  "prompts/*.md"
]
