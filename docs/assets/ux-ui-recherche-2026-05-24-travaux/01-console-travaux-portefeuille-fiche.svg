<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="900" viewBox="0 0 1600 900" role="img" aria-labelledby="title desc">
  <title id="title">Blueprint CoproScope - Travaux, portefeuille des operations et fiche probatoire</title>
  <desc id="desc">Maquette UX de recherche pour suivre les operations travaux, leurs preuves manquantes et la prochaine action.</desc>
  <defs>
    <style>
      .bg{fill:#f4f6f8}
      .nav{fill:#172235}
      .panel{fill:#ffffff;stroke:#d7dde5;stroke-width:2}
      .soft{fill:#eef3f7}
      .text{font-family:Arial,Helvetica,sans-serif;fill:#142033}
      .muted{fill:#627083}
      .white{fill:#ffffff}
      .h1{font-size:36px;font-weight:700}
      .h2{font-size:24px;font-weight:700}
      .h3{font-size:18px;font-weight:700}
      .body{font-size:16px}
      .small{font-size:13px}
      .navtext{font-size:16px;fill:#dce6f3}
      .badge-ok{fill:#dff4e7;stroke:#8acfa2}
      .badge-warn{fill:#fff1d8;stroke:#dcae59}
      .badge-miss{fill:#fde2e2;stroke:#db8b8b}
      .badge-info{fill:#e4efff;stroke:#98b8e8}
      .line{stroke:#d7dde5;stroke-width:2}
      .primary{fill:#2b6cb0}
      .chip{rx:14;ry:14}
    </style>
  </defs>
  <rect class="bg" width="1600" height="900"/>
  <rect class="nav" x="0" y="0" width="250" height="900"/>
  <text class="white" x="32" y="56" font-family="Arial,Helvetica,sans-serif" font-size="28" font-weight="700">CoproScope</text>
  <text class="navtext" x="32" y="126">Cockpit</text>
  <text class="navtext" x="32" y="174">Actions</text>
  <text class="navtext" x="32" y="222">Comptes</text>
  <rect x="20" y="250" width="210" height="42" rx="8" fill="#2b6cb0"/>
  <text class="white" x="32" y="277" font-family="Arial,Helvetica,sans-serif" font-size="16" font-weight="700">Travaux</text>
  <text class="navtext" x="32" y="330">Documents</text>
  <text class="navtext" x="32" y="378">Memoire</text>
  <text class="navtext" x="32" y="426">Passation</text>

  <text class="text h1" x="292" y="62">Travaux</text>
  <text class="muted body" x="292" y="96">Voir l'etat, la preuve manquante et la prochaine demande</text>
  <rect class="panel" x="1220" y="34" width="320" height="52" rx="8"/>
  <text class="muted small" x="1242" y="65">Recherche ou operation</text>
  <rect class="primary" x="1380" y="112" width="160" height="44" rx="8"/>
  <text class="white body" x="1404" y="140" font-family="Arial,Helvetica,sans-serif" font-weight="700">Ajouter</text>

  <g transform="translate(292 120)">
    <rect class="panel" x="0" y="0" width="210" height="82" rx="8"/>
    <text class="muted small" x="18" y="28">Operations ouvertes</text>
    <text class="text h2" x="18" y="62">4</text>
    <rect class="panel" x="230" y="0" width="230" height="82" rx="8"/>
    <text class="muted small" x="248" y="28">Preuves bloquantes</text>
    <text class="text h2" x="248" y="62">3</text>
    <rect class="panel" x="480" y="0" width="230" height="82" rx="8"/>
    <text class="muted small" x="498" y="28">Receptions a prouver</text>
    <text class="text h2" x="498" y="62">1</text>
    <rect class="panel" x="730" y="0" width="230" height="82" rx="8"/>
    <text class="muted small" x="748" y="28">Garanties a surveiller</text>
    <text class="text h2" x="748" y="62">2</text>
  </g>

  <rect class="panel" x="292" y="226" width="850" height="610" rx="8"/>
  <text class="text h2" x="318" y="270">Operations travaux</text>
  <text class="muted small" x="318" y="296">Filtre: preuves bloquantes d'abord</text>
  <line class="line" x1="318" y1="324" x2="1116" y2="324"/>

  <g class="text small" font-weight="700">
    <text x="318" y="354">Operation</text>
    <text x="565" y="354">Etat</text>
    <text x="700" y="354">Preuve manquante</text>
    <text x="920" y="354">Prochaine action</text>
  </g>

  <g class="text body">
    <rect x="310" y="374" width="815" height="92" rx="8" fill="#f8fbff" stroke="#98b8e8"/>
    <text class="h3" x="328" y="407">Etancheite toiture-terrasse</text>
    <text class="muted small" x="328" y="432">Fournisseur: DEMO Toiture</text>
    <rect class="badge-warn chip" x="560" y="392" width="112" height="30"/>
    <text x="578" y="412">Reception</text>
    <rect class="badge-miss chip" x="700" y="392" width="190" height="30"/>
    <text x="718" y="412">PV reception absent</text>
    <rect class="primary" x="920" y="386" width="170" height="42" rx="8"/>
    <text class="white" x="944" y="413" font-family="Arial,Helvetica,sans-serif" font-size="15" font-weight="700">Preparer relance</text>

    <rect x="310" y="486" width="815" height="76" rx="8" fill="#ffffff" stroke="#d7dde5"/>
    <text class="h3" x="328" y="520">Renovation hall</text>
    <rect class="badge-info chip" x="560" y="501" width="120" height="30"/>
    <text x="579" y="521">Commande</text>
    <rect class="badge-miss chip" x="700" y="501" width="190" height="30"/>
    <text x="718" y="521">Assurance a joindre</text>
    <text class="muted small" x="920" y="521">Demander attestation</text>

    <rect x="310" y="582" width="815" height="76" rx="8" fill="#ffffff" stroke="#d7dde5"/>
    <text class="h3" x="328" y="616">Porte parking</text>
    <rect class="badge-warn chip" x="560" y="597" width="116" height="30"/>
    <text x="579" y="617">Devis</text>
    <rect class="badge-miss chip" x="700" y="597" width="190" height="30"/>
    <text x="718" y="617">Decision a retrouver</text>
    <text class="muted small" x="920" y="617">Rattacher PV AG</text>

    <rect x="310" y="678" width="815" height="76" rx="8" fill="#ffffff" stroke="#d7dde5"/>
    <text class="h3" x="328" y="712">Visiophone</text>
    <rect class="badge-ok chip" x="560" y="693" width="116" height="30"/>
    <text x="579" y="713">Garantie</text>
    <rect class="badge-info chip" x="700" y="693" width="190" height="30"/>
    <text x="718" y="713">Date fin garantie</text>
    <text class="muted small" x="920" y="713">Surveiller echeance</text>
  </g>

  <rect class="panel" x="1170" y="226" width="370" height="610" rx="8"/>
  <text class="text h2" x="1196" y="270">Etancheite toiture</text>
  <text class="muted small" x="1196" y="296">Fiche operation probatoire</text>
  <line class="line" x1="1196" y1="324" x2="1514" y2="324"/>
  <text class="text h3" x="1196" y="358">Chaine de preuves</text>
  <g class="text small">
    <circle cx="1210" cy="392" r="9" fill="#8acfa2"/><text x="1230" y="397">Vote AG rattache</text>
    <circle cx="1210" cy="430" r="9" fill="#8acfa2"/><text x="1230" y="435">Devis retenu</text>
    <circle cx="1210" cy="468" r="9" fill="#dcae59"/><text x="1230" y="473">Commande a confirmer</text>
    <circle cx="1210" cy="506" r="9" fill="#db8b8b"/><text x="1230" y="511">PV reception manquant</text>
    <circle cx="1210" cy="544" r="9" fill="#db8b8b"/><text x="1230" y="549">Reserve a lever</text>
    <circle cx="1210" cy="582" r="9" fill="#dcae59"/><text x="1230" y="587">Garantie a dater</text>
  </g>
  <rect class="soft" x="1196" y="620" width="318" height="96" rx="8"/>
  <text class="text h3" x="1218" y="652">Preuve bloquante</text>
  <text class="text body" x="1218" y="680">PV de reception absent</text>
  <text class="muted small" x="1218" y="706">Impossible de classer "clos" sans preuve.</text>
  <rect class="primary" x="1196" y="742" width="318" height="48" rx="8"/>
  <text class="white body" x="1227" y="773" font-family="Arial,Helvetica,sans-serif" font-weight="700">Preparer une demande au syndic</text>
  <text class="muted small" x="1196" y="820">Export travaux: bloque tant que diffusion non arbitree</text>
</svg>
