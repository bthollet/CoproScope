<svg xmlns="http://www.w3.org/2000/svg" width="1440" height="960" viewBox="0 0 1440 960" role="img" aria-label="Blueprint Audit360 anomalies et nouveaux documents">
  <rect width="1440" height="960" fill="#f6f7f8"/>
