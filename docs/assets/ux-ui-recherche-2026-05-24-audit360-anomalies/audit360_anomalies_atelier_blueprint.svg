  <text x="1110" y="80" font-family="Inter, Arial, sans-serif" font-size="16" fill="#59616d">A valider humainement</text>

  <rect x="48" y="130" width="320" height="690" rx="8" fill="#ffffff" stroke="#d6d9de"/>
  <text x="72" y="166" font-family="Inter, Arial, sans-serif" font-size="18" font-weight="700" fill="#20242a">File des points a verifier</text>
  <rect x="72" y="192" width="272" height="94" rx="6" fill="#fff7e6" stroke="#e7b95b"/>
