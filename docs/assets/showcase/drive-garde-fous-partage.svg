<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="680" viewBox="0 0 1200 680" role="img" aria-labelledby="title desc">
  <title id="title">Garde-fous de partage CoproScope</title>
  <desc id="desc">Le partage passe par une revue de confidentialite, une reduction du contenu, une decision humaine, puis un paquet chiffre ou un blocage explique.</desc>
  <defs>
    <marker id="arrow" markerWidth="14" markerHeight="14" refX="12" refY="7" orient="auto" markerUnits="strokeWidth">
      <path d="M2,2 L12,7 L2,12 Z" fill="#1d4ed8"/>
    </marker>
    <filter id="shadow" x="-10%" y="-10%" width="120%" height="130%">
      <feDropShadow dx="0" dy="10" stdDeviation="12" flood-color="#17202a" flood-opacity="0.14"/>
    </filter>
  </defs>
  <rect width="1200" height="680" rx="28" fill="#ffffff"/>
  <text x="72" y="78" font-family="Arial, Helvetica, sans-serif" font-size="36" font-weight="700" fill="#17202a">Garde-fous avant partage</text>
  <text x="72" y="118" font-family="Arial, Helvetica, sans-serif" font-size="20" fill="#526170">Le but n'est pas de tout publier. Le but est de savoir quoi retenir, quoi masquer et quoi bloquer.</text>

  <g filter="url(#shadow)" font-family="Arial, Helvetica, sans-serif">
    <rect x="70" y="190" width="230" height="142" rx="18" fill="#edf4ff" stroke="#bdd7ff" stroke-width="2"/>
    <rect x="350" y="190" width="230" height="142" rx="18" fill="#f5f7fa" stroke="#d7dde5" stroke-width="2"/>
    <rect x="630" y="190" width="230" height="142" rx="18" fill="#e8f5f2" stroke="#addbd3" stroke-width="2"/>
    <rect x="910" y="140" width="230" height="142" rx="18" fill="#e8f5f2" stroke="#addbd3" stroke-width="2"/>
    <rect x="910" y="350" width="230" height="142" rx="18" fill="#fff1f2" stroke="#fecdd3" stroke-width="2"/>
  </g>

  <g font-family="Arial, Helvetica, sans-serif" fill="#17202a">
    <text x="96" y="234" font-size="21" font-weight="700">1. Choisir</text>
    <text x="96" y="268" font-size="18">Ce qui doit etre</text>
    <text x="96" y="294" font-size="18">partage ou transmis.</text>

    <text x="376" y="234" font-size="21" font-weight="700">2. Revoir</text>
    <text x="376" y="268" font-size="18">Donnees sensibles,</text>
    <text x="376" y="294" font-size="18">droits et destinataire.</text>

    <text x="656" y="234" font-size="21" font-weight="700">3. Reduire</text>
    <text x="656" y="268" font-size="18">Biffer, agreger ou</text>
    <text x="656" y="294" font-size="18">retirer le contenu.</text>

    <text x="936" y="184" font-size="21" font-weight="700">4A. Autoriser</text>
    <text x="936" y="218" font-size="18">Paquet chiffre,</text>
    <text x="936" y="244" font-size="18">trace et limite claire.</text>

    <text x="936" y="394" font-size="21" font-weight="700">4B. Bloquer</text>
    <text x="936" y="428" font-size="18">Doute, source brute</text>
    <text x="936" y="454" font-size="18">ou droit insuffisant.</text>
  </g>

  <g stroke="#1d4ed8" stroke-width="5" marker-end="url(#arrow)" fill="none">
    <path d="M305 260 H340"/>
    <path d="M585 260 H620"/>
    <path d="M865 240 C890 220 890 214 900 212"/>
    <path d="M865 282 C890 326 890 404 900 420"/>
  </g>

  <g font-family="Arial, Helvetica, sans-serif">
    <rect x="88" y="520" width="1024" height="86" rx="18" fill="#111827"/>
    <text x="122" y="556" font-size="20" font-weight="700" fill="#eef2f7">Decision humaine obligatoire</text>
    <text x="122" y="584" font-size="18" fill="#cbd5e1">CoproScope prepare, explique et trace. Il ne transforme pas seul une piece en diffusion officielle.</text>
  </g>
</svg>
