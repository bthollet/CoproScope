<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="680" viewBox="0 0 1200 680" role="img" aria-labelledby="title desc">
  <title id="title">Strategie cible Drive de CoproScope</title>
  <desc id="desc">Le poste local garde les documents bruts, CoproScope fabrique un paquet chiffre, Drive transporte ce paquet, puis un autre poste autorise le verifie localement.</desc>
  <defs>
    <marker id="arrow" markerWidth="14" markerHeight="14" refX="12" refY="7" orient="auto" markerUnits="strokeWidth">
      <path d="M2,2 L12,7 L2,12 Z" fill="#0f766e"/>
    </marker>
    <filter id="shadow" x="-10%" y="-10%" width="120%" height="130%">
      <feDropShadow dx="0" dy="10" stdDeviation="12" flood-color="#17202a" flood-opacity="0.16"/>
    </filter>
  </defs>
  <rect width="1200" height="680" rx="28" fill="#f5f7fa"/>
  <text x="72" y="76" font-family="Arial, Helvetica, sans-serif" font-size="36" font-weight="700" fill="#17202a">Strategie Drive cible</text>
  <text x="72" y="116" font-family="Arial, Helvetica, sans-serif" font-size="20" fill="#526170">Drive transporte du chiffre. CoproScope garde le sens, les preuves et les garde-fous localement.</text>

  <g filter="url(#shadow)">
    <rect x="70" y="180" width="230" height="190" rx="18" fill="#edf4ff" stroke="#bdd7ff" stroke-width="2"/>
    <rect x="350" y="180" width="230" height="190" rx="18" fill="#e8f5f2" stroke="#addbd3" stroke-width="2"/>
    <rect x="630" y="180" width="230" height="190" rx="18" fill="#fff7e8" stroke="#f4cf98" stroke-width="2"/>
    <rect x="910" y="180" width="230" height="190" rx="18" fill="#f1f5f9" stroke="#cbd5e1" stroke-width="2"/>
  </g>

  <g font-family="Arial, Helvetica, sans-serif" fill="#17202a">
    <text x="105" y="232" font-size="22" font-weight="700">Poste local</text>
    <text x="105" y="270" font-size="18">Documents bruts</text>
    <text x="105" y="298" font-size="18">Preuves et registres</text>
    <text x="105" y="326" font-size="18">restent ici</text>

    <text x="385" y="232" font-size="22" font-weight="700">Paquet chiffre</text>
    <text x="385" y="270" font-size="18">Manifeste</text>
    <text x="385" y="298" font-size="18">signature</text>
    <text x="385" y="326" font-size="18">aucun brut lisible</text>

    <text x="665" y="232" font-size="22" font-weight="700">Google Drive</text>
    <text x="665" y="270" font-size="18">Transport</text>
    <text x="665" y="298" font-size="18">synchronisation</text>
    <text x="665" y="326" font-size="18">pas source de verite</text>

    <text x="945" y="232" font-size="22" font-weight="700">Poste autorise</text>
    <text x="945" y="270" font-size="18">Verification locale</text>
    <text x="945" y="298" font-size="18">lecture controlee</text>
    <text x="945" y="326" font-size="18">journal humain</text>
  </g>

  <g stroke="#0f766e" stroke-width="5" marker-end="url(#arrow)" fill="none">
    <path d="M305 275 H340"/>
    <path d="M585 275 H620"/>
    <path d="M865 275 H900"/>
  </g>

  <g font-family="Arial, Helvetica, sans-serif" font-size="18">
    <rect x="72" y="456" width="320" height="112" rx="16" fill="#ffffff" stroke="#d7dde5"/>
    <text x="96" y="498" font-weight="700" fill="#17202a">Reste local</text>
    <text x="96" y="532" fill="#526170">Originaux, OCR, chemins,</text>
    <text x="96" y="558" fill="#526170">secrets et cartes de biffage.</text>

    <rect x="440" y="456" width="320" height="112" rx="16" fill="#ffffff" stroke="#d7dde5"/>
    <text x="464" y="498" font-weight="700" fill="#17202a">Partage possible</text>
    <text x="464" y="532" fill="#526170">Seulement un paquet chiffre</text>
    <text x="464" y="558" fill="#526170">et verifie avant transport.</text>

    <rect x="808" y="456" width="320" height="112" rx="16" fill="#ffffff" stroke="#d7dde5"/>
    <text x="832" y="498" font-weight="700" fill="#17202a">Blocage normal</text>
    <text x="832" y="532" fill="#526170">Si le droit, le contenu ou</text>
    <text x="832" y="558" fill="#526170">le destinataire est douteux.</text>
  </g>
</svg>
