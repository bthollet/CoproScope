  <text x="414" y="512" font-family="Arial, sans-serif" font-size="14" fill="#334">Responsable: a confirmer - echeance: 30 juin 2026.</text>
  <rect x="390" y="602" width="174" height="42" rx="6" fill="#2f6f5e"/>
