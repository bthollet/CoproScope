  <text x="1078" y="492" font-family="Arial, sans-serif" font-size="13" fill="#7a2c2c">Interne CS par defaut</text>
  <text x="1078" y="518" font-family="Arial, sans-serif" font-size="13" fill="#7a2c2c">Revue requise avant export</text>
  <rect x="1058" y="760" width="324" height="46" rx="6" fill="#24322f"/>
  <text x="1140" y="789" font-family="Arial, sans-serif" font-size="15" fill="#ffffff">Archiver en memoire</text>
