  <text x="344" y="418" class="ink num">68%</text>
  <text x="286" y="500" class="muted small">Contrats &amp; prestations</text><text x="494" y="500" class="red small">6</text>
  <text x="286" y="530" class="muted small">Travaux &amp; maintenance</text><text x="494" y="530" class="red small">4</text>
  <text x="286" y="558" class="blue small" font-weight="700">Voir le detail par rubrique</text>

