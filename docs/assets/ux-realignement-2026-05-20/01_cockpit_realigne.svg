  <text x="574" y="402" class="ink small" font-weight="700">Contrat entretien ascenseur</text><text x="748" y="402" class="red tag">CRITIQUE</text>
  <text x="574" y="434" class="ink small" font-weight="700">Etat detaille depenses T4</text><text x="748" y="434" fill="#f28c18" class="tag">IMPORTANT</text>
  <text x="574" y="466" class="ink small" font-weight="700">Attestations assurance 2025</text><text x="748" y="466" fill="#f28c18" class="tag">IMPORTANT</text>
  <text x="574" y="558" class="blue small" font-weight="700">Voir toutes les demandes</text>

  <rect x="840" y="270" width="270" height="298" rx="9" class="card"/>
  <text x="862" y="304" class="ink h2">AG</text>
  <rect x="862" y="350" width="58" height="52" rx="8" fill="#e9f8ef"/>
  <text x="876" y="382" class="green h2">15</text><text x="876" y="400" class="green tag">JUIN</text>
  <text x="944" y="380" class="ink small" font-weight="700">Limite envoi convocations</text><text x="944" y="402" class="muted small">AG ordinaire 2025</text>
  <rect x="862" y="434" width="58" height="52" rx="8" fill="#e9f8ef"/>
  <text x="876" y="466" class="green h2">30</text><text x="876" y="484" class="green tag">JUIN</text>
  <text x="944" y="464" class="ink small" font-weight="700">Reception POA</text><text x="944" y="486" class="muted small">dans 41 jours</text>
  <text x="862" y="558" class="blue small" font-weight="700">Voir le calendrier AG</text>

  <rect x="1128" y="270" width="274" height="298" rx="9" class="card"/>
  <text x="1150" y="304" class="ink h2">Controle comptes</text>
  <circle cx="1212" cy="410" r="54" fill="none" stroke="#e7ebf0" stroke-width="14"/>
  <path d="M1212 356 A54 54 0 1 1 1168 442" fill="none" stroke="#38a875" stroke-width="14" stroke-linecap="round"/>
  <path d="M1168 442 A54 54 0 0 1 1172 374" fill="none" stroke="#f28c18" stroke-width="14" stroke-linecap="round"/>
  <text x="1190" y="418" class="ink num">42</text>
  <text x="1284" y="386" class="ink small" font-weight="700">Conformes 24</text>
  <text x="1284" y="420" class="ink small" font-weight="700">A surveiller 12</text>
  <text x="1284" y="454" class="ink small" font-weight="700">Anomalies 6</text>
  <text x="1150" y="558" class="blue small" font-weight="700">Voir le detail des controles</text>

  <rect x="264" y="586" width="1138" height="236" rx="9" class="card"/>
  <text x="286" y="620" class="ink h2">Alertes et risques</text>
  <rect x="286" y="644" width="1092" height="34" fill="#f8fafc" stroke="#dce3ec"/>
  <text x="306" y="666" class="muted small">Niveau</text><text x="430" y="666" class="muted small">Sujet</text><text x="760" y="666" class="muted small">Impact</text><text x="1010" y="666" class="muted small">Prochaine action</text>
  <text x="306" y="706" class="red small" font-weight="700">Critique</text><text x="430" y="706" class="ink small">Assurance multirisque immeuble</text><text x="760" y="706" class="muted small">Couverture</text><text x="1010" y="706" class="ink small">Demander attestation 2025</text>
  <text x="306" y="746" fill="#f28c18" class="small" font-weight="700">Important</text><text x="430" y="746" class="ink small">Fonds travaux non justifie</text><text x="760" y="746" class="muted small">Financier</text><text x="1010" y="746" class="ink small">Question syndic prete</text>
  <text x="306" y="786" fill="#f28c18" class="small" font-weight="700">Important</text><text x="430" y="786" class="ink small">VMC contrat expire</text><text x="760" y="786" class="muted small">Securite</text><text x="1010" y="786" class="ink small">Verifier contrat et diffusion</text>
