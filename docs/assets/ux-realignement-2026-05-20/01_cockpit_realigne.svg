<svg xmlns="http://www.w3.org/2000/svg" width="1440" height="900" viewBox="0 0 1440 900" role="img" aria-labelledby="title desc">
  <title id="title">Cockpit Conseil Syndical - cible enquete realignee</title>
  <desc id="desc">Reprise de la proposition UX d'enquete pour le cockpit, adaptee au produit actuel avec preuve, action et diffusion visibles.</desc>
  <defs>
    <style>
      .bg{fill:#f5f7fb}.side{fill:#071d2d}.side2{fill:#0b2940}.card{fill:#fff;stroke:#dce3ec;stroke-width:1.2}.soft{fill:#f8fafc}.blue{fill:#1f6feb}.green{fill:#219b6c}.orange{fill:#f28c18}.red{fill:#e5484d}.ink{fill:#102033}.muted{fill:#607086}.small{font:14px Arial,sans-serif}.body{font:16px Arial,sans-serif}.h{font:700 24px Arial,sans-serif}.h2{font:700 18px Arial,sans-serif}.num{font:700 34px Arial,sans-serif}.tag{font:700 12px Arial,sans-serif}.white{fill:#fff}
    </style>
  </defs>
  <rect width="1440" height="900" class="bg"/>

  <rect width="238" height="900" class="side"/>
  <text x="48" y="38" class="white h2">Cockpit Conseil Syndical</text>
  <rect x="14" y="70" width="210" height="38" rx="7" class="blue"/>
  <text x="48" y="95" class="white body" font-weight="700">Tableau de bord</text>
  <text x="24" y="150" fill="#8aa4bd" class="tag">ACTIVITES</text>
  <text x="48" y="190" class="white body">A traiter</text><rect x="192" y="174" width="32" height="22" rx="11" class="blue"/><text x="203" y="190" class="white small">12</text>
  <text x="48" y="230" class="white body">Pieces manquantes</text><rect x="192" y="214" width="32" height="22" rx="11" class="blue"/><text x="203" y="230" class="white small">18</text>
  <text x="48" y="270" class="white body">Demandes syndic</text><rect x="198" y="254" width="26" height="22" rx="11" class="blue"/><text x="207" y="270" class="white small">7</text>
  <text x="48" y="310" class="white body">AG</text><rect x="198" y="294" width="26" height="22" rx="11" class="blue"/><text x="207" y="310" class="white small">2</text>
  <text x="48" y="350" class="white body">Controle comptes</text><rect x="198" y="334" width="26" height="22" rx="11" class="blue"/><text x="207" y="350" class="white small">5</text>
  <text x="24" y="420" fill="#8aa4bd" class="tag">DOCUMENTS</text>
  <text x="48" y="460" class="white body">Documents</text>
  <text x="48" y="500" class="white body">Contrats</text>
  <text x="48" y="540" class="white body">Travaux</text>
  <text x="48" y="580" class="white body">Comptabilite</text>
  <rect x="16" y="802" width="206" height="72" rx="8" class="side2" stroke="#24465d"/>
  <text x="52" y="838" class="white body">Mode de partage</text>
  <text x="52" y="862" fill="#78d39a" class="small">Prive (local)</text>

  <rect x="238" y="0" width="1202" height="58" fill="#fff" stroke="#dce3ec"/>
  <text x="264" y="39" class="ink h">Cockpit Conseil Syndical</text>
  <rect x="936" y="14" width="270" height="34" rx="7" fill="#fff" stroke="#cad3df"/>
  <text x="970" y="36" class="muted small">Rechercher documents, actions...</text>
  <rect x="1240" y="76" width="160" height="40" rx="7" fill="#fff" stroke="#1f6feb"/>
  <text x="1268" y="102" class="blue small" font-weight="700">Nouvelle demande</text>

  <text x="264" y="88" class="ink h2">Bonjour,</text>
  <text x="264" y="112" class="muted body">Voici la situation de votre copropriete au 20 mai 2026. La lecture suit la cible d'enquete : preuve, action, memoire.</text>

  <rect x="264" y="132" width="1138" height="116" rx="9" class="card"/>
  <text x="284" y="164" class="ink h2">A traiter</text>
  <g>
    <rect x="286" y="178" width="210" height="54" rx="8" class="soft" stroke="#dce3ec"/>
    <text x="306" y="213" class="red num">12</text><text x="366" y="202" class="ink small" font-weight="700">Actions en retard</text><text x="366" y="224" class="muted small">dont 5 critiques</text>
    <rect x="516" y="178" width="210" height="54" rx="8" class="soft" stroke="#dce3ec"/>
    <text x="536" y="213" class="orange num">18</text><text x="596" y="202" class="ink small" font-weight="700">Pieces manquantes</text><text x="596" y="224" class="muted small">sur 7 rubriques</text>
    <rect x="746" y="178" width="210" height="54" rx="8" class="soft" stroke="#dce3ec"/>
    <text x="766" y="213" class="blue num">7</text><text x="816" y="202" class="ink small" font-weight="700">Demandes syndic</text><text x="816" y="224" class="muted small">en attente</text>
    <rect x="976" y="178" width="190" height="54" rx="8" class="soft" stroke="#dce3ec"/>
    <text x="996" y="213" class="green num">2</text><text x="1040" y="202" class="ink small" font-weight="700">Echeances AG</text><text x="1040" y="224" class="muted small">60 jours</text>
    <rect x="1186" y="178" width="190" height="54" rx="8" class="soft" stroke="#dce3ec"/>
    <text x="1206" y="213" class="red num">5</text><text x="1250" y="202" class="ink small" font-weight="700">Risques diffusion</text><text x="1250" y="224" class="muted small">a arbitrer</text>
  </g>

