<svg xmlns="http://www.w3.org/2000/svg" width="1440" height="900" viewBox="0 0 1440 900" role="img" aria-labelledby="title desc">
  <title id="title">Blueprint Messages recus des coproprietaires</title>
  <desc id="desc">Interface conceptuelle avec file priorisee, panneau de qualification, rattachements et brouillon de reponse.</desc>
  <rect width="1440" height="900" fill="#f6f7f9"/>
  <rect x="0" y="0" width="220" height="900" fill="#202833"/>
  <text x="28" y="54" fill="#ffffff" font-family="Arial, sans-serif" font-size="24" font-weight="700">CoproScope</text>
  <text x="28" y="96" fill="#b7c0cc" font-family="Arial, sans-serif" font-size="15">Conseil syndical</text>
  <rect x="24" y="150" width="172" height="42" rx="6" fill="#314255"/>
  <text x="42" y="176" fill="#ffffff" font-family="Arial, sans-serif" font-size="15">Messages recus</text>
  <text x="42" y="226" fill="#b7c0cc" font-family="Arial, sans-serif" font-size="15">Actions</text>
  <text x="42" y="266" fill="#b7c0cc" font-family="Arial, sans-serif" font-size="15">Pieces</text>
  <text x="42" y="306" fill="#b7c0cc" font-family="Arial, sans-serif" font-size="15">AG / CS</text>
  <text x="42" y="346" fill="#b7c0cc" font-family="Arial, sans-serif" font-size="15">Confidentialite</text>

  <text x="260" y="58" fill="#1c2530" font-family="Arial, sans-serif" font-size="30" font-weight="700">Messages recus des coproprietaires</text>
  <text x="260" y="88" fill="#637083" font-family="Arial, sans-serif" font-size="16">Rien n'est envoye, partage ou cloture sans confirmation humaine.</text>

  <rect x="260" y="120" width="820" height="54" rx="8" fill="#ffffff" stroke="#d9dee7"/>
  <text x="282" y="153" fill="#1c2530" font-family="Arial, sans-serif" font-size="16" font-weight="700">A traiter maintenant</text>
  <rect x="460" y="132" width="118" height="30" rx="15" fill="#f5d16f"/>
  <text x="480" y="153" fill="#503b00" font-family="Arial, sans-serif" font-size="13">Sans preuve 3</text>
  <rect x="596" y="132" width="126" height="30" rx="15" fill="#f4b4a7"/>
  <text x="616" y="153" fill="#682115" font-family="Arial, sans-serif" font-size="13">Restreints 2</text>
  <rect x="740" y="132" width="150" height="30" rx="15" fill="#b9d7ff"/>
  <text x="760" y="153" fill="#173b6a" font-family="Arial, sans-serif" font-size="13">Non rattaches 4</text>

  <rect x="260" y="200" width="460" height="520" rx="8" fill="#ffffff" stroke="#d9dee7"/>
  <text x="284" y="236" fill="#1c2530" font-family="Arial, sans-serif" font-size="19" font-weight="700">File priorisee</text>
  <line x1="284" y1="258" x2="696" y2="258" stroke="#e5e8ef"/>

  <g font-family="Arial, sans-serif">
    <rect x="284" y="282" width="412" height="94" rx="8" fill="#fff8e5" stroke="#f0c85e"/>
    <text x="304" y="308" fill="#1c2530" font-size="15" font-weight="700">Signalement fuite garage</text>
    <text x="304" y="332" fill="#637083" font-size="13">Canal: email resume - Preuve: photo a verifier</text>
    <text x="304" y="356" fill="#7a4d00" font-size="13">Pourquoi maintenant: risque securite avant vendredi</text>
    <rect x="566" y="296" width="104" height="28" rx="14" fill="#d9534f"/>
    <text x="586" y="315" fill="#ffffff" font-size="12">Urgent</text>

    <rect x="284" y="398" width="412" height="94" rx="8" fill="#f8fafc" stroke="#d9dee7"/>
    <text x="304" y="424" fill="#1c2530" font-size="15" font-weight="700">Question ordre du jour AG</text>
    <text x="304" y="448" fill="#637083" font-size="13">Canal: reunion - Preuve: note declarative</text>
    <text x="304" y="472" fill="#173b6a" font-size="13">Suite: instruire en conseil syndical</text>
    <rect x="546" y="412" width="124" height="28" rx="14" fill="#2f80ed"/>
    <text x="566" y="431" fill="#ffffff" font-size="12">A qualifier</text>

    <rect x="284" y="514" width="412" height="94" rx="8" fill="#f8fafc" stroke="#d9dee7"/>
    <text x="304" y="540" fill="#1c2530" font-size="15" font-weight="700">Demande de document</text>
    <text x="304" y="564" fill="#637083" font-size="13">Canal: portail syndic - Diffusion a verifier</text>
    <text x="304" y="588" fill="#356a38" font-size="13">Suite: lier a une piece diffusable</text>
    <rect x="532" y="528" width="138" height="28" rx="14" fill="#4d9b57"/>
    <text x="552" y="547" fill="#ffffff" font-size="12">Preuve attendue</text>
  </g>

  <rect x="744" y="200" width="336" height="520" rx="8" fill="#ffffff" stroke="#d9dee7"/>
  <text x="768" y="236" fill="#1c2530" font-family="Arial, sans-serif" font-size="19" font-weight="700">Comprendre et classer</text>
  <text x="768" y="268" fill="#637083" font-family="Arial, sans-serif" font-size="14">5 questions avant toute reponse.</text>
  <line x1="768" y1="290" x2="1056" y2="290" stroke="#e5e8ef"/>
  <g font-family="Arial, sans-serif" font-size="14">
    <text x="768" y="324" fill="#1c2530" font-weight="700">1. De quoi s'agit-il ?</text>
    <text x="790" y="350" fill="#637083">Signalement / incident</text>
    <text x="768" y="388" fill="#1c2530" font-weight="700">2. Pourquoi maintenant ?</text>
    <text x="790" y="414" fill="#637083">Risque securite, echeance vendredi</text>
    <text x="768" y="452" fill="#1c2530" font-weight="700">3. Quelle preuve ?</text>
    <text x="790" y="478" fill="#637083">Photo candidate, verification requise</text>
    <text x="768" y="516" fill="#1c2530" font-weight="700">4. Qui peut voir ?</text>
    <text x="790" y="542" fill="#637083">CS maintenant, synthese copro plus tard</text>
    <text x="768" y="580" fill="#1c2530" font-weight="700">5. Quelle suite ?</text>
    <text x="790" y="606" fill="#637083">Lier au dossier travaux + demander preuve</text>
  </g>
  <rect x="768" y="646" width="132" height="42" rx="6" fill="#2f80ed"/>
  <text x="790" y="672" fill="#ffffff" font-family="Arial, sans-serif" font-size="14">Lier a un dossier</text>
  <rect x="916" y="646" width="128" height="42" rx="6" fill="#ffffff" stroke="#aab3c2"/>
  <text x="936" y="672" fill="#1c2530" font-family="Arial, sans-serif" font-size="14">Demander preuve</text>

  <rect x="1110" y="120" width="280" height="600" rx="8" fill="#ffffff" stroke="#d9dee7"/>
  <text x="1134" y="158" fill="#1c2530" font-family="Arial, sans-serif" font-size="19" font-weight="700">Preuve, reponse, trace</text>
  <text x="1134" y="190" fill="#637083" font-family="Arial, sans-serif" font-size="14">Original restreint, synthese diffusable.</text>
  <line x1="1134" y1="214" x2="1366" y2="214" stroke="#e5e8ef"/>
  <text x="1134" y="252" fill="#1c2530" font-family="Arial, sans-serif" font-size="15" font-weight="700">Brouillon de reponse</text>
  <rect x="1134" y="270" width="232" height="118" rx="6" fill="#f8fafc" stroke="#d9dee7"/>
  <text x="1152" y="300" fill="#637083" font-family="Arial, sans-serif" font-size="13">Texte local a relire.</text>
  <text x="1152" y="324" fill="#637083" font-family="Arial, sans-serif" font-size="13">Qualite du repondant:</text>
  <text x="1152" y="348" fill="#1c2530" font-family="Arial, sans-serif" font-size="13" font-weight="700">Conseil syndical</text>
  <rect x="1134" y="414" width="232" height="44" rx="6" fill="#fff8e5" stroke="#f0c85e"/>
  <text x="1152" y="441" fill="#7a4d00" font-family="Arial, sans-serif" font-size="13">Mandat a verifier avant sortie</text>
  <text x="1134" y="504" fill="#1c2530" font-family="Arial, sans-serif" font-size="15" font-weight="700">Journal de diligence</text>
  <text x="1152" y="534" fill="#637083" font-family="Arial, sans-serif" font-size="13">04:12 - message recu</text>
  <text x="1152" y="560" fill="#637083" font-family="Arial, sans-serif" font-size="13">04:15 - preuve candidate</text>
  <text x="1152" y="586" fill="#637083" font-family="Arial, sans-serif" font-size="13">04:17 - action a creer</text>

  <rect x="260" y="760" width="1130" height="76" rx="8" fill="#eaf4ee" stroke="#b5d9bf"/>
  <text x="284" y="790" fill="#1f5f2d" font-family="Arial, sans-serif" font-size="17" font-weight="700">Decision UX</text>
  <text x="284" y="818" fill="#1f5f2d" font-family="Arial, sans-serif" font-size="15">Une alerte n'est affichee comme prioritaire que si elle explique pourquoi maintenant et propose une prochaine action humaine.</text>
</svg>
